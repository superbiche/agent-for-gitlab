# Select this include only for AI_TRIGGER=true, without the normal pipeline.
workflow:
  rules:
    - if: '$AI_TRIGGER == "true"'
    - when: never
stages: [ai]
variables:
  REVIEW_MODE: loose # Historical name: confidence >=80, independent of depth.
  REVIEW_PROFILE: risk
  REVIEW_SCORING: agents
  REVIEW_LANG: en
  REVIEW_AUDIENCE: self
  OPENCODE_MODEL: deepseek/deepseek-v4-flash
ai_webhook_handler:
  stage: ai
  image: $AI_AGENT_IMAGE
  tags: []
  before_script: []
  after_script: []
  needs: []
  dependencies: []
  cache: []
  timeout: 45m
  interruptible: false
  script:
    - test "$AI_RESOURCE_TYPE" = merge_request
    - 'node -e "if (!/^\\s*review\\b/i.test(process.env.DIRECT_PROMPT || \"\")) process.exit(1)"'
    - ai-runner
  rules:
    - if: '$AI_TRIGGER == "true"'
  artifacts:
    when: always
    paths: [ai-output.json]
    expire_in: 2 weeks
