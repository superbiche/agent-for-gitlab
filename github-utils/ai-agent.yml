# GitHub Actions workflow for the @ai agent.
# The webhook app dispatches a repository_dispatch event (type: ai-agent)
# when a PR/issue comment mentions @ai. The runner posts back via REST.
#
# Runs on a self-hosted ARC scale set whose runner image carries the agent
# toolchain (lugus: `arc-runner-ai`, infra servers/lugus/infra/arc/
# runner-image-ai/, built FROM this repo's agent-image). Runner pods have no
# Docker daemon. The agent runs as the image's separate `agent` user through
# its single sudo rule; sudo resets the environment, so every variable the
# agent needs must be listed in --preserve-env. Set `runs-on` to the scale-set
# name only (adding `self-hosted` queues jobs forever).
#
# Required repository secrets/variables:
# - OPENCODE_MODEL is NOT a repository secret or variable: the webhook app sends
#   `provider/model`, for example deepseek/<model-id>, in the dispatch payload.
# - Provider key for the selected model (e.g. DEEPSEEK_API_KEY). For DeepSeek,
#   the key comes from the dedicated Bitwarden item "DeepSeek API Key - Github CI"
#   (mapping bw-env.d/deepseek-github-ci.env, var DEEPSEEK_GITHUB_CI_API_KEY),
#   never the workstation key. Rotate by piping it on stdin (no --body flag:
#   `--body -` stores a literal "-"):
#     bw-env-run --file ~/.config/setup-new-machines/bw-env.d/deepseek-github-ci.env -- \
#       bash -c 'printf %s "$DEEPSEEK_GITHUB_CI_API_KEY" | gh secret set DEEPSEEK_API_KEY --repo <owner/repo>'
#   The webhook app never holds the provider key; only this repo secret does.
# - GITHUB_TOKEN is provided automatically; for private repos or
#   cross-repo dispatch use a fine-grained PAT with contents+pull-requests write.
#
# Review-mode variables mirror gitlab-utils/.gitlab-ci.yml:
# - REVIEW_MODE / REVIEW_PROFILE / REVIEW_SCORING / REVIEW_LANG / REVIEW_AUDIENCE
# - REVIEW_MAX_DIFF_TOKENS / REVIEW_SMALL_MODEL / REVIEW_SMALL_MAX_LINES /
#   REVIEW_SMALL_MAX_FILES (see README)

name: ai-agent

on:
  repository_dispatch:
    types: [ai-agent]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai_webhook_handler:
    if: ${{ github.event.client_payload.trigger == 'ai' }}
    runs-on: <repo>-ai
    env:
      # Static on the GitHub path — the webhook dispatch payload is capped at
      # 10 client_payload properties (see gitlab-app/src/index.ts), so these
      # default here instead of riding the dispatch.
      AI_PLATFORM: github
      AI_GITHUB_USERNAME: github-actions[bot]
      AI_AUTHOR: ${{ github.event.client_payload.AI_AUTHOR }}
      AI_RESOURCE_TYPE: ${{ github.event.client_payload.AI_RESOURCE_TYPE }}
      AI_RESOURCE_ID: ${{ github.event.client_payload.AI_RESOURCE_ID }}
      AI_PROJECT_PATH: ${{ github.event.client_payload.AI_PROJECT_PATH }}
      AI_BRANCH: ${{ github.event.client_payload.AI_BRANCH }}
      AI_TRIGGER_NOTE_ID: ${{ github.event.client_payload.AI_TRIGGER_NOTE_ID }}
      DIRECT_PROMPT: ${{ github.event.client_payload.DIRECT_PROMPT }}
      OPENCODE_MODEL: ${{ github.event.client_payload.OPENCODE_MODEL }}
      OPENCODE_AGENT_PROMPT: ${{ github.event.client_payload.OPENCODE_AGENT_PROMPT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provider key for OPENCODE_MODEL (and REVIEW_SMALL_MODEL, if set).
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Review tuning (override per repo via variables):
      REVIEW_MODE: ${{ vars.REVIEW_MODE }}
      REVIEW_PROFILE: ${{ vars.REVIEW_PROFILE }}
      REVIEW_SCORING: ${{ vars.REVIEW_SCORING }}
      REVIEW_LANG: ${{ vars.REVIEW_LANG }}
      REVIEW_AUDIENCE: ${{ vars.REVIEW_AUDIENCE }}
      REVIEW_MAX_DIFF_TOKENS: ${{ vars.REVIEW_MAX_DIFF_TOKENS }}
      REVIEW_SMALL_MODEL: ${{ vars.REVIEW_SMALL_MODEL }}
      REVIEW_SMALL_MAX_LINES: ${{ vars.REVIEW_SMALL_MAX_LINES }}
      REVIEW_SMALL_MAX_FILES: ${{ vars.REVIEW_SMALL_MAX_FILES }}
    steps:
      - name: Run AI agent
        shell: bash
        run: |
          cd /opt/agent
          # Add any other provider key to env above and to this list.
          sudo -n -H -u agent \
            --preserve-env=AI_PLATFORM,AI_GITHUB_USERNAME,AI_AUTHOR,AI_RESOURCE_TYPE,AI_RESOURCE_ID,AI_PROJECT_PATH,AI_BRANCH,AI_TRIGGER_NOTE_ID,DIRECT_PROMPT,OPENCODE_MODEL,OPENCODE_AGENT_PROMPT,GITHUB_TOKEN,DEEPSEEK_API_KEY,REVIEW_MODE,REVIEW_PROFILE,REVIEW_SCORING,REVIEW_LANG,REVIEW_AUDIENCE,REVIEW_MAX_DIFF_TOKENS,REVIEW_SMALL_MODEL,REVIEW_SMALL_MAX_LINES,REVIEW_SMALL_MAX_FILES \
            /usr/local/bin/ai-runner
